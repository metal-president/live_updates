name: live_updates
description: >-
  iOS Live Activities and Android Live Update notifications with one Dart
  API. Built on FFIgen and JNIgen, no platform channels.
version: 0.4.1
homepage: https://github.com/metal-president/live_updates
repository: https://github.com/metal-president/live_updates/tree/main/packages/live_updates
issue_tracker: https://github.com/metal-president/live_updates/issues
topics: [live-activities, notifications, ios, android, dynamic-island]
screenshots:
  - description: iOS Live Activity on the Lock Screen with buttons, a timer and progress.
    path: doc/screenshots/ios_lock_screen.png
  - description: iOS Live Activity in the Dynamic Island (compact).
    path: doc/screenshots/ios_dynamic_island.png
  - description: Android 16 Live Update with progress stages and buttons.
    path: doc/screenshots/android_16.png
  - description: Android 17 Live Update with a countdown and a distance metric.
    path: doc/screenshots/android_17.png
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  jni: ^1.2.1
  meta: ^1.16.0
  objective_c: ^9.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^23.0.0
  jnigen: ^1.1.0

executables:
  create:

flutter:
  plugin:
    platforms:
      android:
        package: com.ttechapp.live_updates
        pluginClass: LiveUpdatesPlugin
      ios:
        pluginClass: LiveUpdatesPlugin
