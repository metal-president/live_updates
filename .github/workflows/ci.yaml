name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: flutter analyze packages
      - run: flutter test
        working-directory: packages/live_updates
      - run: flutter test
        working-directory: packages/live_updates_fcm
      - run: dart pub publish --dry-run
        working-directory: packages/live_updates

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter build apk --debug
        working-directory: packages/live_updates/example

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Robolectric needs Java 21 to run Android 16+ sandboxes.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter build apk --config-only
        working-directory: packages/live_updates/example
      - run: ./gradlew :live_updates:testDebugUnitTest
        working-directory: packages/live_updates/example/android

  build-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        dependency-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Switch example to CocoaPods
        if: matrix.dependency-manager == 'cocoapods'
        run: sed -i '' '/enable-swift-package-manager/d; /^  config:$/d' pubspec.yaml
        working-directory: packages/live_updates/example
      - run: xcodebuild -version
      - run: flutter build ios --simulator --debug
        working-directory: packages/live_updates/example

  # Xcode 27 is a preview image on GitHub; not a required check, so the
  # required build-ios jobs (Xcode 26 on macos-latest) keep their names.
  build-ios-xcode-27:
    runs-on: xcode-27
    strategy:
      matrix:
        dependency-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Switch example to CocoaPods
        if: matrix.dependency-manager == 'cocoapods'
        run: sed -i '' '/enable-swift-package-manager/d; /^  config:$/d' pubspec.yaml
        working-directory: packages/live_updates/example
      - run: xcodebuild -version
      - run: flutter build ios --simulator --debug
        working-directory: packages/live_updates/example
