name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether this pull request changes more than documentation.
  changes:
    uses: ./.github/workflows/changes.yaml

  # Always runs: it also compiles the README code examples.
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages tool
      - run: flutter analyze packages tool
      - name: Check README code examples
        run: |
          dart run tool/check_readme_snippets.dart
          flutter analyze build/readme_snippets
      - run: flutter test
        working-directory: packages/live_updates
      - run: flutter test
        working-directory: packages/live_updates_fcm
      - run: dart pub publish --dry-run
        working-directory: packages/live_updates

  build-android:
    needs: changes
    # Skipped for docs-only pull requests; runs if the check itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter build apk --debug
        working-directory: packages/live_updates/example

  ios-unit-test:
    needs: changes
    # Skipped for docs-only pull requests; runs if the check itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: xcodebuild -version
      # Generates the Flutter build settings the Xcode project needs.
      - run: flutter build ios --simulator --debug
        working-directory: packages/live_updates/example
      - name: Boot an iPhone simulator
        id: sim
        run: |
          # Newest iPhone on a plain iOS runtime (no device-specific ones).
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              parts = runtime.split(".iOS-")[1].split("-")
              if not all(p.isdigit() for p in parts):
                  continue
              version = tuple(int(p) for p in parts)
              for d in items:
                  if d["name"].startswith("iPhone") and "Duo" not in d["name"]:
                      if best is None or version > best[0]:
                          best = (version, d["udid"])
          print(best[1])
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Swift tests of the plugin (RunnerTests): content-state decoding,
      # button press routing and URL checks.
      - run: >
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner
          -destination "id=${{ steps.sim.outputs.udid }}"
          -only-testing:RunnerTests -parallel-testing-enabled NO
        working-directory: packages/live_updates/example/ios

  android-unit-test:
    needs: changes
    # Skipped for docs-only pull requests; runs if the check itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Robolectric needs Java 21 to run Android 16+ sandboxes.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter build apk --config-only
        working-directory: packages/live_updates/example
      - run: ./gradlew :live_updates:testDebugUnitTest
        working-directory: packages/live_updates/example/android
      # NewApi: APIs above minSdk 24 must sit behind a version check.
      - run: ./gradlew :live_updates:lintDebug
        working-directory: packages/live_updates/example/android

  build-ios:
    needs: changes
    # A required check: skipping a matrix job as a whole would not report
    # "build-ios (swiftpm)" and "build-ios (cocoapods)", so for docs-only
    # pull requests the job runs and skips its steps instead, on a Linux
    # runner (the check name stays the same).
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.code != 'false' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    strategy:
      matrix:
        dependency-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.CODE == 'true'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Switch example to CocoaPods
        if: env.CODE == 'true' && matrix.dependency-manager == 'cocoapods'
        run: sed -i '' '/enable-swift-package-manager/d; /^  config:$/d' pubspec.yaml
        working-directory: packages/live_updates/example
      - run: xcodebuild -version
        if: env.CODE == 'true'
      - run: flutter build ios --simulator --debug
        if: env.CODE == 'true'
        working-directory: packages/live_updates/example

  # Xcode 27 is a preview image on GitHub; not a required check, so the
  # required build-ios jobs (Xcode 26 on macos-latest) keep their names.
  build-ios-xcode-27:
    needs: changes
    # Skipped for docs-only pull requests; runs if the check itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: xcode-27
    strategy:
      matrix:
        dependency-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Switch example to CocoaPods
        if: matrix.dependency-manager == 'cocoapods'
        run: sed -i '' '/enable-swift-package-manager/d; /^  config:$/d' pubspec.yaml
        working-directory: packages/live_updates/example
      - run: xcodebuild -version
      - run: flutter build ios --simulator --debug
        working-directory: packages/live_updates/example
