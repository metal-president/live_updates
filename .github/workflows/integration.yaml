name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-ios:
    strategy:
      fail-fast: false
      matrix:
        # Xcode 26 (macos-latest) on every PR; the Xcode 27 preview image
        # (slow to get and to run) only on main and when started by hand.
        runner: ${{ github.event_name == 'pull_request' && fromJSON('["macos-latest"]') || fromJSON('["macos-latest", "xcode-27"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: xcodebuild -version
      - name: Boot an iPhone simulator
        id: sim
        run: |
          # Newest available iPhone runtime (Live Activities need iOS 17.2+).
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              if ".iOS-" not in runtime:
                  continue
              # e.g. ...SimRuntime.iOS-26-5. Skip device-specific runtimes
              # (a suffix such as -iPhone19) and foldable models.
              parts = runtime.split(".iOS-")[1].split("-")
              if not all(p.isdigit() for p in parts):
                  continue
              version = tuple(int(p) for p in parts)
              for d in items:
                  name = d["name"]
                  if not name.startswith("iPhone") or "Duo" in name:
                      continue
                  if best is None or version > best[0]:
                      best = (version, d["udid"], d["name"])
          print(best[1]); print(best, file=sys.stderr)
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # The app sometimes never starts on a fresh simulator, and flutter test
      # waits for it until the job times out: give each attempt 20 minutes
      # and try once more on a rebooted simulator.
      - name: flutter test integration_test
        working-directory: packages/live_updates/example
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          run() { perl -e 'alarm shift; exec @ARGV' 1200 flutter test integration_test -d "$UDID"; }
          if run; then exit 0; fi
          echo "::warning::First attempt failed or timed out; retrying on a rebooted simulator."
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          run

  integration-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 36.1: promoted Live Updates; 37.0: MetricStyle and semantic colors.
        api-level: ["36.1", "37.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter build apk --debug
        working-directory: packages/live_updates/example
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # avdmanager writes target=android-0 for minor API levels such as
          # 37.0, which makes the emulator run without acceleration.
          pre-emulator-launch-script: |
            api=${{ matrix.api-level }}; sed -i -E "s/^target=android-0$/target=android-${api%%.*}/" "$ANDROID_AVD_HOME"/*.ini; cat "$ANDROID_AVD_HOME"/*.ini
          working-directory: packages/live_updates/example
          script: ./tool/integration_test_android.sh emulator-5554
